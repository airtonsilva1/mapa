<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapa Nutrição Clínica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: mobile-first ward tool — sticky day header, filter rail, bed cards; bottom tab bar (Mapa | Admissões); full-screen sheets for editing. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eaeef0; --line:#d6dde1;
  --ink:#14232b; --ink-2:#4f6069; --ink-3:#7c8b93;
  --accent:#1d6f8c; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --late:#b4232c; --late-soft:#fbe4e5; --today:#a85a00; --today-soft:#fdeed6;
  --ok:#2b7a4b; --ok-soft:#dff1e6; --tn:#6b3fa0; --tn-soft:#ece3f7; --zero:#33424a; --zero-soft:#e1e6e9;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1519; --surface:#162127; --surface-2:#1d2a31; --line:#2a3a42;
  --ink:#e6eef1; --ink-2:#a9b8bf; --ink-3:#7b8d95;
  --accent:#5bb5d4; --accent-ink:#06222c; --accent-soft:#173543;
  --late:#ff7b82; --late-soft:#3a1d21; --today:#f0ad4e; --today-soft:#3a2c14;
  --ok:#6fcf97; --ok-soft:#173225; --tn:#c3a0f0; --tn-soft:#2c2340; --zero:#c4d0d6; --zero-soft:#26343b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1519; --surface:#162127; --surface-2:#1d2a31; --line:#2a3a42;
  --ink:#e6eef1; --ink-2:#a9b8bf; --ink-3:#7b8d95;
  --accent:#5bb5d4; --accent-ink:#06222c; --accent-soft:#173543;
  --late:#ff7b82; --late-soft:#3a1d21; --today:#f0ad4e; --today-soft:#3a2c14;
  --ok:#6fcf97; --ok-soft:#173225; --tn:#c3a0f0; --tn-soft:#2c2340; --zero:#c4d0d6; --zero-soft:#26343b; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 10px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
.toprow h1 small{display:block;font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.daysel{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 8px;max-width:150px}

/* summary strip */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sum button{border:0;border-radius:10px;padding:7px 4px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;gap:1px}
.sum b{font-family:var(--f-num);font-size:18px;line-height:1.1}
.sum span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600}
.sum .late{background:var(--late-soft)} .sum .late b{color:var(--late)}
.sum .today{background:var(--today-soft)} .sum .today b{color:var(--today)}
.sum .zero{background:var(--zero-soft)} .sum .pend{background:var(--accent-soft)} .sum .pend b{color:var(--accent)} .sum .tn{background:var(--tn-soft)} .sum .tn b{color:var(--tn)}
.sum4{grid-template-columns:repeat(4,1fr)} .sum4 b{font-size:17px} .sum4 span{font-size:9.5px;letter-spacing:.03em} .sum .tot{background:var(--ink);} .sum .tot b,.sum .tot span{color:var(--bg)}
.sum button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px)) 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-num);font-weight:500;opacity:.75;margin-left:4px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* list */
main .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-2);margin:8px 2px 0;display:flex;gap:8px;align-items:center}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card.late{border-color:color-mix(in srgb,var(--late) 55%,var(--line))}
.card.today{border-color:color-mix(in srgb,var(--today) 55%,var(--line))}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.card.adm{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))} .card.adm .stripe{background:var(--accent)}
.card.late .stripe{background:var(--late)} .card.today .stripe{background:var(--today)}
.card-h{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 12px 10px 14px;width:100%;text-align:left;border:0;background:none}
.bed{font-family:var(--f-num);font-weight:600;font-size:20px;line-height:1;padding-top:2px;min-width:44px}
.bed small{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-top:4px}
.who{min-width:0}
.who .n{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.who .m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dates{text-align:right;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.dates .d{font-family:var(--f-num);font-size:12px;padding:1px 6px;border-radius:6px;white-space:nowrap}
.d.late{background:var(--late-soft);color:var(--late);font-weight:600}
.d.today{background:var(--today-soft);color:var(--today);font-weight:600}
.diet{grid-column:2 / 4;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.badges{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:5px}
.b{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase}
.b.late{background:var(--late-soft);color:var(--late)} .b.today{background:var(--today-soft);color:var(--today)}
.b.tn{background:var(--tn-soft);color:var(--tn)} .b.zero{background:var(--zero);color:var(--bg)}
.b.risk{background:var(--late-soft);color:var(--late)} .b.ok{background:var(--ok-soft);color:var(--ok)}
.b.lvl{background:var(--accent-soft);color:var(--accent)}
.done-row{display:flex;gap:6px;padding:0 12px 12px 14px;flex-wrap:wrap}
.tick{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.tick[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tick .box{width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:10px;line-height:1}
.note-peek{margin:0 12px 12px 14px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.empty-bed{display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:13px;padding:6px 4px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--today-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto}
.nav button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .pill{font-family:var(--f-num);font-size:10px;background:var(--today);color:#fff;border-radius:999px;padding:0 5px;margin-left:3px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sheet-h{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-h .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.sheet-h h2{flex:1;min-width:0;margin:0;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet-b .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h3{flex:1;margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:800}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.f label .sp{flex:1}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;font-size:16px;min-width:0}
.f textarea{min-height:64px;resize:vertical;line-height:1.4}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.cp.done{color:var(--ok);border-color:var(--ok)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc div{background:var(--surface-2);border-radius:9px;padding:7px 8px;min-width:0}
.calc span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:700}
.calc b{font-family:var(--f-num);font-size:15px;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nrs-opt{display:flex;flex-direction:column;gap:6px}
.nrs-opt button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:13px;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.nrs-opt button b{font-family:var(--f-num)}
.nrs-opt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.score{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.score b{font-family:var(--f-num);font-size:26px}
.score.risk{background:var(--late-soft);color:var(--late)} .score.norisk{background:var(--ok-soft);color:var(--ok)}
.photo{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.photo p{margin:0;font-size:13px;color:var(--ink-2)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.status{font-size:13px;color:var(--ink-2)}
.status.err{color:var(--late)}
.plantao{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);border-radius:9px;padding:9px 10px;max-height:240px;overflow-y:auto;overflow-wrap:anywhere}
.ro{font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.ro-l{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.outv{font-family:var(--f-num);font-size:15px;background:var(--surface-2);border-radius:9px;padding:9px 10px;min-height:40px;overflow-wrap:anywhere}
.mini{font-size:12px;font-weight:600;color:var(--ink-2);min-width:52px}
.adm-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.adm-info{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px;color:var(--ink)}
.adm-info span{display:inline-flex;gap:5px;align-items:baseline;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.adm-info em,.adm-dx em{font-style:normal;font-family:var(--f-ui);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.adm-dx{margin-top:3px;font-size:13px;color:var(--ink);overflow-wrap:anywhere;display:flex;gap:6px;align-items:baseline}
.adm-dx em{flex:none;min-width:74px}
.adm-dx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.adm-dx.alg span{color:var(--late);font-weight:600}
.nd{font-style:normal;color:var(--ink-3)}
.adm-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:0 10px 10px}
.adm-act .del-slot:empty{display:none}
.adm-card{background:none;border:0;border-radius:var(--r);padding:12px 14px 6px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;text-align:left;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding:8px 10px;background:var(--late-soft);border-radius:9px}

.setor-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,0px));z-index:5;background:var(--bg);padding:8px 2px 6px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink);display:flex;gap:8px;align-items:center}
.setor-h span{font-weight:500;color:var(--ink-2);letter-spacing:0;font-size:12.5px}
.vago{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px 10px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);font-size:13px}
.vago .bed{color:var(--ink-3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .t{font-weight:700}
.list-row .s{font-size:12.5px;color:var(--ink-2)}
.pend-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.pend-card .why{grid-column:2;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere}
.pend-card .act{grid-column:1 / 3;display:flex;gap:6px;flex-wrap:wrap}
.hero-up{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero-up h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.hero-up p{margin:0;color:var(--ink-2);font-size:14px;max-width:46ch}
.bedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bedgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;font-family:var(--f-num);font-weight:600;font-size:14px}
.bedgrid button[aria-pressed="false"]{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.photo-list{display:flex;flex-direction:column;gap:6px;width:100%}
.photo-item{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:9px;padding:6px}
.photo-item img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.photo-item span{font-size:12.5px;color:var(--ink-2)}
.photo-item b{display:block;font-size:13px;color:var(--ink)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.calc{grid-template-columns:1fr 1fr}.sum b{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.card,.chip,.tick{transition:background-color .15s,border-color .15s}}

/* ---------- polish (all sizes) ---------- */
.top{box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(10,30,40,.25)}
.card,.adm-wrap,.pend-card{box-shadow:0 1px 2px rgba(16,30,40,.05),0 4px 14px -8px rgba(16,30,40,.12)}
@media (prefers-reduced-motion:no-preference){.card,.adm-wrap,.pend-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s}}
.nav{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:2px 10px;width:44px;box-sizing:content-box;margin:-2px 0}
.brand,.prod{display:none}
.prod-m{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pm{display:flex;flex-direction:column;gap:4px;min-width:0}
.pm-t{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- fluidez ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){
  main .wrap.enter > *{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
  main .wrap.enter > :nth-child(2){animation-delay:.02s} main .wrap.enter > :nth-child(3){animation-delay:.04s}
  main .wrap.enter > :nth-child(4){animation-delay:.06s} main .wrap.enter > :nth-child(5){animation-delay:.08s}
  main .wrap.enter > :nth-child(6){animation-delay:.10s} main .wrap.enter > :nth-child(n+7){animation-delay:.12s}
  .card.just{animation:pop .4s ease}
  .tick{transition:background-color .15s,color .15s,transform .1s} .tick:active{transform:scale(.96)}
  .top .wrap,.sum button,.toprow h1{transition:all .2s ease}
}

  /* modo lista: uma linha por leito */

  .lista .card:hover{transform:none}
  .lista .vago{padding:6px 10px 6px 14px}
}

mark{background:#ffe866;color:#2a2300;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

  const status = s => { const a = app(); if (a) a.setSave(s); };
  function applyLocal(m){
    const before = localDocs(); localStorage.setItem(LS, JSON.stringify(m.docs)); localStorage.setItem(K_TOMB, JSON.stringify(m.tomb));
    return !same(before, m.docs);

    if (SEED){ try { const s = await dec(SEED); const m = merge(s, { docs:localDocs(), tomb:localTomb() }); applyLocal(m); } catch(e){ console.warn('seed', e); } }

  (async () => {

  })();

    e.preventDefault();

    const u = document.getElementById('lg-u').value.trim().toLowerCase(), pw = document.getElementById('lg-p').value.trim();
    if (await sha(u + ':' + pw) !== H){ err.textContent = 'Login ou senha incorretos.'; err.hidden = false; return; }

})();

<script>
// Map PDF parser — shared by the app (browser) and the node test.
// Expects a pdf.js namespace (pdfjsLib) and an ArrayBuffer/Uint8Array.
(function (root) {
  const COLS_FALLBACK = [28, 113, 227, 298, 369, 439, 510, 567, 680, 822];
  const COL_KEYS = ['leito', 'diag', 'dieta', 'triagem', 'tn', 'bloq', 'alerg', 'pref', 'plantao'];

  function mul(m, n) {
    return [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
  }
  function apply(m, x, y) { return [m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]]; }

  async function pageRects(pdfjs, page) {
    const OPS = pdfjs.OPS; const rects = [];
    try {
      const ol = await page.getOperatorList();
      let ctm = [1,0,0,1,0,0]; const stack = [];
      for (let i = 0; i < ol.fnArray.length; i++) {
        const fn = ol.fnArray[i], a = ol.argsArray[i];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || [1,0,0,1,0,0];
        else if (fn === OPS.transform) ctm = mul(ctm, a);
        else if (fn === OPS.constructPath) {
          const ops = a[0], args = a[1]; let k = 0;
          for (const op of ops) {
            if (op === OPS.rectangle) {
              const [x, y, w, h] = args.slice(k, k + 4); k += 4;
              const p1 = apply(ctm, x, y), p2 = apply(ctm, x + w, y + h);
              rects.push({ x0: Math.min(p1[0], p2[0]), x1: Math.max(p1[0], p2[0]), y0: Math.min(p1[1], p2[1]), y1: Math.max(p1[1], p2[1]) });
            } else if (op === OPS.moveTo || op === OPS.lineTo) k += 2;
            else if (op === OPS.curveTo) k += 6;
            else if (op === OPS.curveTo2 || op === OPS.curveTo3) k += 4;
          }
        }
      }
    } catch (e) { /* fall back */ }
    return rects;
  }

  function cellLines(items) {
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - it.y) < 2.5) last.parts.push(it); else lines.push({ y: it.y, parts: [it] });
    }
    return lines.map(l => l.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  }

  async function parseMapPdf(pdfjs, data) {
    const doc = await pdfjs.getDocument({ data }).promise;
    const rows = []; let mapDate = null; const setores = new Set();
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5] }));
      let setor = '';
      const title = cellLines(items.filter(i => i.y > 520)).join(' ');
      const tm = title.match(/-\s*([0-9A-Z]{1,4})\s*-\s*(\d{2})\/(\d{2})\/(\d{4})/);
      if (tm) { setor = tm[1]; mapDate = mapDate || `${tm[4]}-${tm[3]}-${tm[2]}`; setores.add(setor); }
      let rects = (await pageRects(pdfjs, page)).filter(r => r.x1 - r.x0 > 20 && r.y1 - r.y0 > 10);
      // columns from rect x positions
      let xs = [...new Set(rects.map(r => Math.round(r.x0)))].sort((a, b) => a - b);
      let cols = xs.length >= 9 ? xs.slice(0, 9).concat([Math.round(Math.max(...rects.map(r => r.x1)))]) : COLS_FALLBACK;

      let bands = [];
      for (const r of rects) {
        if (Math.round(r.x0) !== cols[0]) continue;
        bands.push({ top: r.y1, bot: r.y0 });
      }
      bands.sort((a, b) => b.top - a.top);

        const cells = {};
        COL_KEYS.forEach((key, c) => {
          cells[key] = cellLines(items.filter(i => i.y <= b.top + 1 && i.y >= b.bot - 1 && i.x >= cols[c] - 1 && i.x < cols[c + 1] - 1));
        });
        if (!cells.leito.length && !cells.plantao.length) continue;

        const bedLine = cells.leito.find(l => /^\d{3,4}[A-Z]?$/.test(l));
        if (!bedLine && rows.length) {
          const prev = rows[rows.length - 1];
          COL_KEYS.forEach(k => prev.raw[k] = prev.raw[k].concat(cells[k]));
          continue;
        }
        rows.push({ setor, raw: cells });
      }
    }
    return { mapDate, setores: [...setores], patients: rows.map(r => toPatient(r)).filter(Boolean) };
  }

  const dash = v => (!v || /^-+$/.test(v.trim()) ? '' : v.trim());
  function grab(text, label, stops) {
    const re = new RegExp(label + '\\s*:?\\s*([\\s\\S]*?)(?=' + (stops.length ? stops.join('|') + '|' : '') + '$)', 'i');

  }

  function parseDiag(D) {
    const o = {};

    const has = /\b(Di|HDA|HPP|Contrl):/.test(D);
    o.di = grab(D, 'Di:', stopsD.filter(s => s !== 'Di:'));
    o.hda = grab(D, 'HDA:', stopsD.filter(s => s !== 'HDA:'));
    o.hpp = grab(D, 'HPP:', stopsD.filter(s => s !== 'HPP:')).replace(/^HPP:\s*/i, '');
    o.po = (D.match(/\b(PO [^:]*?)(?= HPP:| HDA:| Contrl:|$)/) || [])[1] || '';
    o.controle = grab(D, 'Contrl:', ['Refeição acompanhante:']);
    o.refAcomp = grab(D, 'Refeição acompanhante:', []);
    if (!has && !o.di) o.di = dash(D);
    return o;
  }

  function toPatient(r) {
    const L = r.raw.leito; const lt = L.join('\n');
    const bedIdx = L.findIndex(l => /^\d{3,4}[A-Z]?$/.test(l));
    if (bedIdx < 0) return null;
    const leito = L[bedIdx];
    const flag = L.some(l => l.includes('*'));
    // name: lines after bed until "Filiação" / "- (" / "Registro"
    const nameParts = [];
    for (let i = bedIdx + 1; i < L.length; i++) { if (/^(Filia|- \(|\(|Registro|-$|-,)/.test(L[i]) || /\(\d+ anos/.test(L[i])) break; nameParts.push(L[i]); }
    const nome = dash(nameParts.join(' ').replace(/\*/g, ' ').replace(/\s+/g, ' '));
    const flat = L.join(' ');
    const p = {
      id: r.setor + '-' + leito, setor: r.setor, leito, flag, nome,
      filiacao: grab(flat, 'Filiação', ['- \\(', '\\(\\d', 'Registro']),
      idade: (flat.match(/\((\d+ anos?(?: \d+ m[eê]s(?:es)?)?)\)/) || [])[1] || '',
      registro: dash((flat.match(/Registro:\s*(\S+)/) || [])[1] || ''),
      peso: (flat.match(/([\d.,]+)\s*Kg,/i) || [])[1] || '',
      altura: (flat.match(/([\d.,]+)\s*cm/i) || [])[1] || '',
      imc: (flat.match(/IMC:\s*([\d.,]+)/) || [])[1] || '',
      pi: (flat.match(/P\.I:\s*([\d.,]+)/) || [])[1] || '',
      classIMC: '', obsLeito: ''
    };
    const after = flat.split(/P\.I:\s*[\d.,-]+\s*Kg?/i)[1] || '';
    const ex = after.trim().split(/\s(?=\()/);
    p.classIMC = dash(ex[0] || ''); p.obsLeito = (after.match(/\(([^)]+)\)\s*$/) || [])[1] || '';
    if (!p.nome) return { id: p.id, setor: p.setor, leito, vazio: true };
    Object.assign(p, parseDiag(r.raw.diag.join(' ')));
    const Dt = r.raw.dieta.join(' ');
    p.dieta = dash((Dt.split(/\s(?:Rest:|Obs\. Geral:)/)[0].replace(/^Dieta:\s*/i, '')).replace(/\s*-\s*$/, ''));
    p.restDieta = grab(Dt, 'Rest:', ['Obs\\. Geral:']);
    p.obsGeral = grab(Dt, 'Obs\\. Geral:', []);
    const T = r.raw.triagem.join(' ');
    const ts = ['N\\.A:', 'Adm:', 'Prox\\. Evol:', 'Prox\\. Reav:'];
    p.nrs = grab(T, 'NRS:', ts);
    p.na = (T.match(/N\.A:\s*(\d)/) || [])[1] || '';
    p.adm = brDate(grab(T, 'Adm:', ts.slice(2)));
    p.proxEvol = brDate(grab(T, 'Prox\\. Evol:', ['Prox\\. Reav:']));
    p.proxReav = brDate(grab(T, 'Prox\\. Reav:', []));
    const N = r.raw.tn.join(' ');
    const ns = ['SNO:', 'Item Avulso:', 'Líq\\. Espess\\.:', 'Rest:', 'AC:', 'UFI:', 'Lab:'];
    p.vet = dash(N.split(/\s?(?:SNO:|Item Avulso:|Líq\. Espess\.:|Rest:|AC:|UFI:|Lab:)/)[0]);
    p.sno = grab(N, 'SNO:', ns.filter(s => s !== 'SNO:'));
    p.itemAvulso = grab(N, 'Item Avulso:', ns.filter(s => s !== 'Item Avulso:'));
    p.liqEsp = grab(N, 'Líq\\. Espess\\.:', ns.filter(s => !s.startsWith('Líq')));
    p.ac = grab(N, 'AC:', ns.filter(s => s !== 'AC:'));
    p.ufi = grab(N, 'UFI:', ns.filter(s => s !== 'UFI:'));
    p.lab = grab(N, 'Lab:', []);
    p.bloqueios = dash(r.raw.bloq.join(' '));
    p.alergias = dash(r.raw.alerg.join(' '));
    p.preferencias = dash(r.raw.pref.join(' '));
    p.plantao = dash(r.raw.plantao.join('\n').replace(/\n(?!\d{2}\/\d{2}|\d{2}\/\d{2})/g, ' '));
    // only the first column filled (labels and dashes don't count) = new admission
    // "Contrl" and "Refeição acompanhante" are filled at hospital admission, so they don't count
    const resto = [p.di, p.hda, p.hpp].concat(['dieta','triagem','tn','bloq','alerg','pref','plantao'].map(k => r.raw[k].join(' '))).join(' ');
    p.soColuna1 = !resto.replace(/[A-Za-zÀ-ÿ.()\/ ]{1,30}:/g, ' ').replace(/[-–—\s]/g, '');
    return p;
  }

  root.MapParser = { parseMapPdf, toPatient, parseDiag };
  if (typeof module !== 'undefined') module.exports = root.MapParser;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

const EVOL_DIAS = {1:7, 2:5, 3:3};

function idadeAnos(txt, nasc){
  if (nasc){ const [y,m,d] = nasc.split('-').map(Number); const t = new Date(); let a = t.getFullYear() - y; if (t.getMonth()+1 < m || (t.getMonth()+1 === m && t.getDate() < d)) a--; return a; }

}
function imcInfo(peso, alturaCm, idade){
  const p = num(peso), h = num(alturaCm); if (!p || !h) return {};
  const m = h > 3 ? h / 100 : h; const imc = p / (m*m);
  const idoso = idade != null && idade >= 60;

  else cls = imc < 18.5 ? 'Baixo peso' : imc < 25 ? 'Eutrofia' : imc < 30 ? 'Sobrepeso' : imc < 35 ? 'Obesidade 1' : imc < 40 ? 'Obesidade 2' : 'Obesidade 3';
  return { imc, cls, pi: (idoso ? 24.5 : 21.7) * m * m, idoso };

function andarFechado(leito, setor){ const s = String(setor || leito || '').trim(); return /^[145]/.test(s); }
const CANCER_RE = /neoplasi|c[aâ]ncer|\bca\s+(de|do|da|gastr|colo|reto|pulm|mama|pr[oó]st|p[aâ]ncre|es[oô]f)|\bca\b(?=\s*[a-z]{3,})|tumor|carcinom|adenocarcinom|linfoma|leucemi|mieloma|sarcoma|met[aá]stase|onco|quimioter|radioter/i;
const HIV_RE = /\bhiv\b|\bsida\b|\baids\b/i;
// Guia de bolso — nível de assistência:
//  3º Terciário: setor fechado (1º, 4º e 5º andar), TNE ou TNP, menor de 18 anos fora da pediatria
//  2º Secundário: risco nutricional (NRS ≥ 3), câncer, HIV positivo
//  1º Primário: nenhum dos critérios acima
const andarDe = (setor, leito) => (String(setor || leito || '').trim().match(/^\d/) || [''])[0];
const TNE_TXT = /enteral|\btne\b|\bsne\b|\bsng\b|\bsnj\b|\bsoe\b|\bgtt\b|\bgep\b|gastrost|jejunost|via sonda|por sonda|dieta por sonda/i;
const TNP_TXT = /parenteral|\bnpt\b|\btnp\b|kabiven|olimel|oliclinomel|nutriflex|smofkabiven/i;
function nivelGuia(o){
  const w3 = [], w2 = [];
  const idade = o.idade != null ? o.idade : null;
  const andar = andarDe(o.setor, o.leito);
  if (/^[145]$/.test(andar)) w3.push(`${andar}º andar é setor fechado`);
  if (o.tnp) w3.push('terapia nutricional parenteral (TNP)');
  if (o.tne) w3.push('terapia nutricional enteral (TNE)');
  if (idade != null && idade < 18 && !/ped/i.test(o.setor || '')) w3.push('menor de 18 anos fora da pediatria');
  if (w3.length) return { n:3, why:w3 };
  if (o.nrs != null && o.nrs >= 3) w2.push(`NRS ${o.nrs} (com risco nutricional)`);
  if (o.cancer || CANCER_RE.test(o.txt || '')) w2.push('câncer');
  if (o.hiv || HIV_RE.test(o.txt || '')) w2.push('HIV positivo');
  if (w2.length) return { n:2, why:w2 };
  return { n:1, why:['sem critério de 2º ou 3º (sem risco nutricional)'] };
}
function nivelSugerido(a){
  const bed = typeof admLeito === 'function' ? admLeito(a) : null; const be = bed ? eff(bed) : null; const bk = be ? cat(be, todayISO()) : {};
  const diet = [a.via, a.dieta, a.tn, be && be.dieta, be && be.vet].join(' ');
  const s = nrsScore(a); const nb = be ? parseInt(be.nrs) : NaN;
  return nivelGuia({ idade: idadeAnos(a.idade || (be && be.idade), a.nasc), setor: a.setor || (be && be.setor), leito: a.leito || (be && be.leito),
    tne: /enteral/i.test(a.via || '') || TNE_TXT.test(diet) || !!bk.tne, tnp: /parenteral/i.test(a.via || '') || TNP_TXT.test(diet) || !!bk.tnp,
    nrs: s != null ? s : (isFinite(nb) ? nb : null), cancer: a.cancer, hiv: a.hiv,

}
function nrsScore(a){
  if (a.nrsEstado == null && a.nrsGrav == null) return null;
  const idade = idadeAnos(a.idade, a.nasc);
  return (a.nrsEstado || 0) + (a.nrsGrav || 0) + (idade != null && idade >= 70 ? 1 : 0);

const nrsTexto = s => s == null ? '' : `${s} - ${s >= 3 ? 'COM RISCO' : 'SEM RISCO'}`;

// A bed that has only name/registro/age (no diagnosis, diet, screening or handover) is a new admission.
// "Cadastro Fictício": real patient registered by reception without parents' names / birth date.
const isFicticio = p => /cadastro\s+fict/i.test(p.filiacao || '');
function isBlankAdmission(p){
  if (p.vazio || !p.nome || p.naoAdmissao) return false;
  if (p.soColuna1) return true;
  // fallback: no diagnosis, diet, NRS or handover (admission date, level and dates may already be filled)
  return !p.di && !p.hda && !p.hpp && !p.dieta && !parseInt(p.nrs) && !p.plantao;
}
// Every admission-looking bed of the active day gets a card in Admissões (unless you removed it).
function syncAdmissions(day){
  if (!day || S.example) return 0; let n = 0; day.admIgnoradas = day.admIgnoradas || [];
  for (const p of day.patients){
    if (isHidden(p) || p.outroNutri || p.alta || day.admIgnoradas.includes(p.id)) continue;
    if (p.admissao || isBlankAdmission(p)){ if (!p.admissao){ p.admissao = true; n++; } if (!admForBed(p)){ admFromMap(p, day); n++; } }
  }
  return n;
}
// Visit pending: last handover entry flagged "pendência de visita" and no later day-shift entry; night entries don't count as a visit.
function pendFromPlantao(txt){
  if (!txt) return false;
  let pend = false;
  for (const line of String(txt).split('\n')){
    const l = line.trim(); if (!l) continue;
    if (/pend[eêé]ncia\s*(de\s*)?visita|pend\.?\s*visita/i.test(l)) pend = true;
    else if (!/noturn/i.test(l)) pend = false;
  }
  return pend;
}
function cat(p, ref){
  const d = (p.dieta || '') + ' ' + (p.vet || '');
  const c = {};
  c.zero = /\bZERO\b|JEJUM/i.test(p.dieta || '');
  c.tne = /ENTERAL|\bTNE\b|\bSNE\b|\bSNG\b|\bGTT\b|\bSOE\b|\bGEP\b/i.test(d);
  c.tnp = /PARENTERAL|\bNPT\b|\bTNP\b/i.test(d);
  c.sup = !!(p.sno || p.itemAvulso);
  c.tn = c.tne || c.tnp; // terapia nutricional = enteral ou parenteral
  const n = parseInt(p.na); c.nivel = [1,2,3].includes(n) ? n : null;
  c.n1 = c.nivel === 1; c.n2 = c.nivel === 2; c.n3 = c.nivel === 3;
  const nr = parseInt(p.nrs); c.risco = isFinite(nr) ? nr >= 3 : null;
  const ev = p.proxEvol, rv = p.proxReav;
  const valid = x => x && x >= '2020-01-01' && x <= addDays(ref, 400);
  c.evolLate = valid(ev) && ev < ref; c.evolToday = ev === ref;
  c.reavLate = valid(rv) && rv < ref; c.reavToday = rv === ref;
  c.late = c.evolLate || c.reavLate; c.today = !c.late && (c.evolToday || c.reavToday);
  c.admissao = !!p.admissao || isBlankAdmission(p);
  c.outro = !!p.outroNutri;
  const visited = p.done && p.done.visita === ref;
  if (visited || p.pendManual === 'no-' + ref) c.pend = false;
  else if (p.pendManual === ref) c.pend = true;
  else c.pend = !c.admissao && pendFromPlantao(p.plantao); // admissions are visited anyway
  // another nutritionist's patient: shown in the map, but counts for nothing of yours
  if (c.outro) for (const key of ['late','today','zero','tn','tne','tnp','sup','risco','pend','admissao','n1','n2','n3','evolLate','evolToday','reavLate','reavToday']) c[key] = false;
  return c;
}
function eff(p){ return Object.assign({}, p, p.edit || {}); }
// For filters/counts: a bed ticked today as Evoluído/Reavaliado keeps the dates it had before the tick, so it stays in the same tab (just shown as checked).
function effFiltro(p){ const e = eff(p); const ref = todayISO(); const d = p.done || {}; const pv = p.prev || {};

// ---------- storage: private db per user, localStorage as local copy ----------
const LS = 'mapa-nutri-v1';
const store = {
  db: null, uid: null, q: {}, busy: {},
  lsAll(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ return {}; } },
  lsPut(key, val){ try { const a = this.lsAll(); if (val === null) delete a[key]; else a[key] = val; localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} },
  async init(){
    if (!window.claude || !window.claude.use) return;
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (user && db){ this.uid = await user.id(); this.db = db; }
    } catch(e){ this.db = null; }
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  async loadAll(){
    const out = this.lsAll();
    if (!this.db) return out;
    try {
      const snap = await Promise.race([this.col().get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]);
      const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = JSON.parse(JSON.stringify(d.data())); }); // snapshots are frozen: work on copies
      for (const k of Object.keys(remote)){ if (!out[k] || (remote[k].updatedAt || 0) >= (out[k].updatedAt || 0)) out[k] = remote[k]; }
      for (const k of Object.keys(out)){ if (!remote[k]) this.put(k, out[k], true); }
      return out;
    } catch(e){ return out; }
  },
  put(key, val, quiet){
    if (val && !quiet) val.updatedAt = Date.now();
    this.lsPut(key, val);
    setSave('saving');
    try { window.__onPut && window.__onPut(key, val); } catch(e){}
    if (!this.db && !window.__ghSync) setTimeout(() => setSave('local'), 250);
    if (!this.db) return;
    this.q[key] = val; clearTimeout(this['t' + key]);
    this['t' + key] = setTimeout(() => this.flush(key), quiet ? 50 : 300);
  },
  async flush(key){
    if (this.busy[key]) { this['t' + key] = setTimeout(() => this.flush(key), 400); return; }
    if (!(key in this.q)) return;
    const val = this.q[key]; delete this.q[key]; this.busy[key] = true;
    try { const ref = this.col().doc(key); if (val === null) await ref.delete(); else await ref.set(JSON.parse(JSON.stringify(val))); if (!Object.keys(this.q).length) setSave('cloud'); }
    catch(e){ console.warn('save failed', key, e); setSave('error'); }
    this.busy[key] = false;
  }
};

function passes(p, k){
  const F = S.f;
  const vago = p.vazio || p.alta;
  if (F.setor.size && !F.setor.has(p.setor)) return false;
  if (F.andar && F.andar.size && !F.andar.has(andarDe(p.setor, p.leito))) return false;
  if (vago) return (F.cats.has('vazio') || (F.status === 'todos' && !F.cats.size && !F.nivel.size)) && !F.q;
  if (F.cats.has('vazio') && F.cats.size === 1 && F.status === 'todos') return false;
  if (F.status !== 'todos' && !k[F.status]) return false;
  const cats = [...F.cats].filter(c => c !== 'vazio');
  if (cats.length && !cats.every(c => c === 'tnesup' ? (k.tne && k.sup) : !!k[c])) return false;

// ---------- my beds ----------
function openLeitos(){
  const day = curDay(); if (!day) return;
  const draw = () => {
    let body = `<section class="sec"><div class="sec-h"><h3>Faixa de leitos</h3></div>
      <div class="grid2"><div class="f"><label for="lr-de">Do leito</label><input id="lr-de" inputmode="numeric" placeholder="220"></div><div class="f"><label for="lr-ate">Até o leito</label><input id="lr-ate" inputmode="numeric" placeholder="225"></div></div>

      <span class="hint" style="font-size:12px;color:var(--ink-3)">A escolha vale para os próximos mapas também, até você mudar.</span></section>`;
    for (const setor of day.setores){
      const g = day.patients.filter(p => p.setor === setor).sort(bedSort);
      body += `<section class="sec"><div class="sec-h"><h3>${esc(setor)} · toque para tirar ou incluir</h3></div><div class="bedgrid">${g.map(p => `<button type="button" data-bed="${esc(p.id)}" aria-pressed="${!isHidden(p)}">${esc(p.leito)}</button>`).join('')}</div></section>`;
    }
    const el = sheet('Meus leitos', body);
    el.querySelectorAll('[data-bed]').forEach(b => b.onclick = () => {
      const id = b.dataset.bed; const h = S.settings.hidden; const i = h.indexOf(id);
      if (i >= 0) h.splice(i, 1); else h.push(id);
      b.setAttribute('aria-pressed', i >= 0); saveSettings();
    });
    $('#lr-ok', el).onclick = () => {
      const de = parseInt($('#lr-de', el).value), ate = parseInt($('#lr-ate', el).value);
      if (!isFinite(de) || !isFinite(ate)) { toast('Informe os dois leitos'); return; }
      const lo = Math.min(de, ate), hi = Math.max(de, ate);
      S.settings.hidden = day.patients.filter(p => { const n = parseInt(p.leito); return !(n >= lo && n <= hi); }).map(p => p.id);

  draw();
}

          a.fotos = a.fotos || []; a.fotos.push({ thumb:'', tipo:'PDF', resumo: f.name + (n ? ` · ${n} campo(s)` : ' · nada novo') });
        } catch(e){ console.warn(e); st.className = 'status err'; st.textContent = `Não consegui abrir ${f.name}.`; }

function setupPhoto(el, a, onFill){

        }

function nivelEsperado(p){

}
const ALERTA_RE = /bronco\s*aspira\w*|aspira[çc][aã]o|disfagi\w*|engasg\w*|tosse ao degluti\w*|v[oô]mit\w*|n[aá]usea\w*|emese|diarr[eé]i\w*|distens[aã]o|res[ií]duo g[aá]strico|intoler[aâ]nci\w*|recus\w*|baix[ao] aceita[çc][aã]o|aceita[çc][aã]o (ruim|baixa|reduzida|parcial)|n[aã]o aceit\w*|inapet[eê]nci\w*|hiporexi\w*|jejum prolongad\w*|zero h[aá]|perda de peso|emagrec\w*|desnutri\w*|caqu[eé]x\w*|hipoglicemi\w*|hiperglicemi\w*|hgt \d{3}|glicemia|sangrament\w*|hemorragi\w*|hematêmese|melena|les[aã]o por press[aã]o|\blpp\b|escara|sacou|retirou (a )?(sne|sng|sonda)|sonda (saiu|deslocad\w*|obstru\w*)|tracionou|piora\w*|instabil\w*|\buti\b|\bcti\b|intuba\w*|\biot\b|extuba\w*|paliativ\w*|cuidados de conforto|[oó]bito|alergi\w*|hipercalemi\w*|hipocalemi\w*|pot[aá]ssio|f[oó]sforo|realimenta[çc][aã]o|s[ií]ndrome de realimenta|fístula|deiscênci\w*|íleo|suboclus\w*|obstipa\w*|constipa\w*|sem evacuar|reintrodu\w*|progredir dieta/gi;
function hl(text){
  const e = esc(text); ALERTA_RE.lastIndex = 0;
  return e.replace(ALERTA_RE, m => `<mark>${m}</mark>`);
}
function alertasPlantao(p){
  const lines = String(p.plantao || '').split('\n').map(x => x.trim()).filter(Boolean).slice(-4);
  return lines.filter(l => { ALERTA_RE.lastIndex = 0; return ALERTA_RE.test(l) && !/^[^:]*:\s*-?\s*$/.test(l); });
}
function atencaoDe(p0){
  if (!p0 || p0.vazio || p0.alta || p0.outroNutri || isHidden(p0)) return null;
  const p = eff(p0); const k = cat(p, todayISO()); const o = { p0, p, nivel:null, plantao:[] };
  o.prazo = []; const ref = todayISO();
  if (!k.admissao){
    const esp = nivelEsperado(p);
    if (k.nivel && esp.n > k.nivel) o.nivel = { atual:k.nivel, esp:esp.n, why:esp.why, tipo:'abaixo' };
    else if (k.nivel && esp.n < k.nivel) o.nivel = { atual:k.nivel, esp:esp.n, why:esp.why, tipo:'acima' };
    else if (!k.nivel) o.nivel = { atual:null, esp:esp.n, why:esp.why, tipo:'sem' };
    if (!isFinite(parseInt(p.nrs))) o.prazo.push('Sem triagem NRS registrada no mapa.');
    const dias = d => Math.round((new Date(d) - new Date(ref)) / 864e5);
    const lim = EVOL_DIAS[esp.n];
    if (p.proxEvol && dias(p.proxEvol) > lim) o.prazo.push(`Próx. evolução ${br(p.proxEvol)} passa do prazo do ${esp.n}º ${NIVEL_NOME[esp.n]} (a cada ${lim} dias): no máximo ${br(addDays(ref, lim))}.`);
    if (!p.proxEvol) o.prazo.push('Sem data de próxima evolução no mapa.');
    const ri = reavIntervalo(p, ref);
    if (p.proxReav && dias(p.proxReav) > ri) o.prazo.push(`Próx. reavaliação ${br(p.proxReav)} passa do intervalo do Guia (${ri} dias${p.adm ? ', internado desde ' + br(p.adm) : ''}): no máximo ${br(addDays(ref, ri))}.`);
  } else {
    const a = admForBed(p0);
    if (a){ const sug = nivelSugerido(a); const atual = parseInt(p.na) || null; // nível lançado no MV/mapa
      if (atual && atual < sug.n) o.nivel = { atual, esp:sug.n, why:sug.why, tipo:'abaixo' };
      else if (atual && atual > sug.n) o.nivel = { atual, esp:sug.n, why:sug.why, tipo:'acima' }; }
  }
  o.plantao = alertasPlantao(p);
  return (o.nivel || o.plantao.length || o.prazo.length) ? o : null;
}
