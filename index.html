const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=document.getElementById('msg'),btn=document.getElementById('b');
async function abrir(login,senha){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(login.trim().toLowerCase()+':'+senha),'PBKDF2',false,['deriveKey']);
  const ku=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:d64(D.salt),iterations:D.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let raw=null;
  for(const e of D.users){ try{ raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(e.iv)},ku,d64(e.k))); break; }catch(_){} }
  if(!raw) return false;
  const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  let doc=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(D.iv)},K,d64(D.ct)));
  /* chave da sincronização entre aparelhos: derivada do login, fica só nesta aba */
  try{ const sb=await crypto.subtle.importKey('raw',enc.encode(login.trim().toLowerCase()+':'+senha),'PBKDF2',false,['deriveKey']);
    const sk=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('mapa-nutri-sync-v1'),iterations:310000},sb,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
    const raw=new Uint8Array(await crypto.subtle.exportKey('raw',sk)); let s=''; raw.forEach(b=>s+=String.fromCharCode(b)); sessionStorage.setItem('mapa_sk',btoa(s)); }catch(_){}
  try{ sessionStorage.setItem('mapa_ok','1'); }catch(_){}
  document.open(); document.write(doc); document.close();
  return true;
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); btn.disabled=true; msg.textContent='';
  try{ if(!(await abrir(document.getElementById('u').value,document.getElementById('p').value))) msg.textContent='Login ou senha incorretos.'; }
  catch(e){ msg.textContent='Não foi possível abrir. Use um navegador atualizado e o endereço https do site.'; }
  btn.disabled=false;
});
